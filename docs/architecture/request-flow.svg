<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 856" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inkling-request-flow-title inkling-request-flow-desc" id="request-flow-root">
<title id="inkling-request-flow-title">One request through inkling</title>
<desc id="inkling-request-flow-desc">Each request is passed through untouched unless the model is in scope and reads pixels well; then each stale block is imaged only when the image costs fewer tokens than its text.</desc>
<defs>
