      #request-flow-root { --paper:#f7f5f0;--paper-2:#ece9e1;--ink:#1b2733;--muted:#475a6b;--soft:#56687a;--accent:#0d7a6a;--link:#3b4fb8;--node:#ffffff;--ink-rgb:27,39,51;--muted-rgb:71,90,107;--soft-rgb:86,104,122;--accent-rgb:13,122,106; }
      @media (prefers-color-scheme: dark) { #request-flow-root { --paper:#1b2733;--paper-2:#263646;--ink:#f7f5f0;--muted:#c3c8cc;--soft:#93a3b1;--accent:#4cc4ad;--link:#8b9cf0;--node:#263646;--ink-rgb:247,245,240;--muted-rgb:195,200,204;--soft-rgb:147,163,177;--accent-rgb:76,196,173; } }
      #request-flow-root { font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--ink); }
      #request-flow-root .diagram-container { width:100%;overflow-x:auto }
      #request-flow-root .notes { margin-top:1.25rem;max-width:820px;color:var(--muted);font-size:.82rem;line-height:1.55;padding-left:1.1rem }
      #request-flow-root .notes li { margin-bottom:.35rem }
      #request-flow-root .notes code { font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:.76rem;color:var(--ink) }</style><marker id="request-flow-inkling-request-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--muted)"/></marker><marker id="request-flow-inkling-request-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--accent)"/></marker><marker id="request-flow-inkling-request-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--link)"/></marker><marker id="request-flow-inkling-request-flow-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" style="fill:none;stroke:var(--muted);stroke-width:1.2"/></marker></defs>
