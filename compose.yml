services:
  inkling:
    build:
      context: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${INKLING_PORT:-47821}:47821"
    environment:
      - INKLING_MODELS
      - INKLING_DISABLE
      - INKLING_UPSTREAM
      - ANTHROPIC_UPSTREAM
      - OPENAI_UPSTREAM
      - OPENAI_API_KEY
      - OPENAI_MODELS
      - CLOUDFLARE_MODELS
      - CLOUDFLARE_ACCOUNT_ID
      - CLOUDFLARE_API_TOKEN
      - INKLING_PROVIDER
      - INKLING_GATEWAY_BASE_URL
      - INKLING_GATEWAY_HEADERS
      - INKLING_GPT_PROFILES
      - INKLING_DUMP_DIR
      - INKLING_DEBUG_CAPTURE_4XX
    volumes:
      - inkling-data:/data

volumes:
  inkling-data:
