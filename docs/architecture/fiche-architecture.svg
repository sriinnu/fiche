<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" width="1280" height="650" role="img" aria-labelledby="fiche-arch-title fiche-arch-desc" id="fiche-arch-root">
  <title id="fiche-arch-title">fiche · Hybrid Context-MMU &amp; Optical Architecture (v0.19 · P0–P3)</title>
  <desc id="fiche-arch-desc">End-to-end topology showing client CLIs/apps, TLS Warp and loopback proxy (:47821), model router and 4-axis vision calibration registry, P0–P3 Context-MMU and Calibrated Optical compilers, prefix-cache seal state, 29 built-in upstream hosts across 21 providers, and local stats/MCP surfaces.</desc>
  <defs>
    <style>
      #fiche-arch-root {
        --paper: #f7f5f0;
        --paper-2: #ece9e1;
        --node: #ffffff;
        --ink: #1b2733;
        --muted: #475a6b;
        --border: rgba(27, 39, 51, 0.20);
        --accent: #0d7a6a;
        --link: #3b4fb8;
        --warn: #b45309;
        --violet: #6d28d9;
        --opt-bg: rgba(180, 83, 9, 0.06);
        --mm-bg: rgba(13, 122, 106, 0.06);
        --dag-bg: rgba(59, 79, 184, 0.06);
        --vil-bg: rgba(109, 40, 217, 0.06);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #fiche-arch-root {
          --paper: #1b2733;
          --paper-2: #263646;
          --node: #263646;
          --ink: #f7f5f0;
          --muted: #c3c8cc;
          --border: rgba(247, 245, 240, 0.22);
          --accent: #4cc4ad;
          --link: #8b9cf0;
          --warn: #ff9e64;
          --violet: #d8b4fe;
          --opt-bg: rgba(255, 158, 100, 0.08);
          --mm-bg: rgba(76, 196, 173, 0.08);
          --dag-bg: rgba(139, 156, 240, 0.08);
          --vil-bg: rgba(216, 180, 254, 0.08);
        }
      }
      .canvas { fill: var(--paper); }
      .frame { fill: none; stroke: var(--border); stroke-width: 1; }
      .col { fill: var(--paper-2); stroke: var(--border); stroke-width: 1; }
      .card { fill: var(--node); stroke: var(--border); stroke-width: 1; }
      .card-accent { fill: var(--node); stroke: var(--accent); stroke-width: 1.1; }
      .card-link { fill: var(--node); stroke: var(--link); stroke-width: 1.1; }
      .card-violet { fill: var(--node); stroke: var(--violet); stroke-width: 1.1; }
      .card-opt { fill: var(--opt-bg); stroke: var(--warn); stroke-width: 1.1; }
      .ink { fill: var(--ink); }
      .muted { fill: var(--muted); }
      .accent { fill: var(--accent); }
      .link { fill: var(--link); }
      .warn { fill: var(--warn); }
      .violet { fill: var(--violet); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <marker id="arr-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" style="fill: var(--link)"/>
    </marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" style="fill: var(--warn)"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" style="fill: var(--accent)"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" style="fill: var(--violet)"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="650" rx="14" class="canvas"/>
  <rect x="14" y="14" width="1252" height="622" rx="10" class="frame"/>

  <!-- Header -->
  <text x="36" y="45" font-size="18" font-weight="700" class="ink">fiche · Hybrid Context-MMU &amp; Optical Architecture (v0.19 · P0–P3)</text>
  <text x="36" y="66" font-size="11" class="mono muted">Pure src/core/ (zero node: imports, zero Buffer) · Prefix-Cache Safe · Read/Diff Protection</text>
  <rect x="964" y="25" width="282" height="32" rx="6" class="card-accent"/>
  <text x="1105" y="45" font-size="11" font-weight="700" text-anchor="middle" class="mono accent">33.9–39.5% Wtd · 87–90% KV</text>

  <!-- Column 1: Agents & Warp -->
  <rect x="34" y="90" width="230" height="436" rx="10" class="col"/>
  <text x="48" y="113" font-size="10.5" font-weight="700" letter-spacing="0.9" class="mono link">1 · AGENTS &amp; WARP</text>

  <rect x="48" y="128" width="202" height="58" rx="7" class="card"/>
  <text x="60" y="149" font-size="12" font-weight="700" class="ink">Coding CLIs &amp; IDEs</text>
  <text x="60" y="169" font-size="10" class="mono muted">claude·codex·gemini·agy</text>

  <rect x="48" y="198" width="202" height="58" rx="7" class="card"/>
  <text x="60" y="219" font-size="12" font-weight="700" class="ink">TLS Warp &amp; Loopback</text>
  <text x="60" y="239" font-size="10" class="mono muted">CONNECT MITM :47821</text>

  <rect x="48" y="268" width="202" height="74" rx="7" class="card"/>
  <text x="60" y="289" font-size="12" font-weight="700" class="ink">MMU &amp; Calibration CLI</text>
  <text x="60" y="309" font-size="9.5" class="mono accent">fiche calibrate &lt;model&gt;</text>
  <text x="60" y="327" font-size="9.5" class="mono accent">fiche mmu stats|pages|page</text>

  <rect x="48" y="354" width="202" height="74" rx="7" class="card"/>
  <text x="60" y="375" font-size="12" font-weight="700" class="ink">FicheBar.app (macOS)</text>
  <text x="60" y="395" font-size="9.5" class="mono muted">SwiftUI · My Providers</text>
  <text x="60" y="413" font-size="9.5" class="mono warn">0 LLM tokens / poll</text>

  <rect x="48" y="440" width="202" height="70" rx="7" class="card"/>
  <text x="60" y="461" font-size="12" font-weight="700" class="ink">Bypass &amp; Origin Guard</text>
  <text x="60" y="481" font-size="9.5" class="mono muted">x-fiche-bypass: 1</text>
  <text x="60" y="497" font-size="9.5" class="mono muted">Same-origin dashboard</text>

  <!-- Column 2: Router & Calibration -->
  <rect x="284" y="90" width="234" height="436" rx="10" class="col"/>
  <text x="298" y="113" font-size="10.5" font-weight="700" letter-spacing="0.9" class="mono violet">2 · ROUTER &amp; CALIBRATION</text>

  <rect x="298" y="128" width="206" height="64" rx="7" class="card"/>
  <text x="310" y="149" font-size="12" font-weight="700" class="ink">Wire Adapter</text>
  <text x="310" y="167" font-size="9.5" class="mono muted">Anthropic /v1/messages</text>
  <text x="310" y="182" font-size="9.5" class="mono muted">OAI Responses &amp; Gemini</text>

  <rect x="298" y="204" width="206" height="108" rx="7" class="card-link"/>
  <text x="310" y="225" font-size="12" font-weight="700" class="link">Auto-Canary Registry</text>
  <text x="310" y="244" font-size="9.5" class="mono ink">HEX&gt;=.85 CODE&gt;=.90 NUM&gt;=.95</text>
  <text x="310" y="261" font-size="9.5" class="mono ink">GUARD=1.0 · &lt;=512p cliff cap</text>
  <text x="310" y="278" font-size="9.5" class="mono muted">tile&lt;=768px · 0600 JSON</text>
  <text x="310" y="295" font-size="9.5" class="mono accent">5x8 -&gt; 5x10 -&gt; 12 -&gt; 14</text>

  <rect x="298" y="324" width="206" height="88" rx="7" class="card"/>
  <text x="310" y="345" font-size="12" font-weight="700" class="ink">EditSafe &amp; L0 Guard</text>
  <text x="310" y="364" font-size="9.5" class="mono muted">FILE_READ_TOOL_RE skipped</text>
  <text x="310" y="381" font-size="9.5" class="mono muted">isCodeOrDiffProtected</text>
  <text x="310" y="398" font-size="9.5" class="mono accent">Write/Edit/Read verbatim</text>

  <rect x="298" y="424" width="206" height="86" rx="7" class="card"/>
  <text x="310" y="445" font-size="12" font-weight="700" class="ink">Kosha Economics Gate</text>
  <text x="310" y="464" font-size="9.5" class="mono muted">payback &amp; cache cliff gate</text>
  <text x="310" y="481" font-size="9.5" class="mono warn">1.25x Anthropic write cost</text>
  <text x="310" y="497" font-size="9.5" class="mono muted">noteCacheOutcome(rd, wr)</text>

  <!-- Column 3: P0-P3 Text + Context-MMU & Optical -->
  <rect x="538" y="90" width="444" height="436" rx="10" class="col"/>
  <text x="552" y="113" font-size="10.5" font-weight="700" letter-spacing="0.9" class="mono accent">3 · P0–P3 TEXT + CONTEXT-MMU &amp; OPTICAL</text>

  <!-- Optical strip -->
  <rect x="552" y="128" width="416" height="64" rx="7" class="card-opt"/>
  <text x="564" y="148" font-size="11.5" font-weight="700" class="warn">Optical Microfiche Path (Calibrated Vision Models)</text>
  <text x="564" y="165" font-size="9.5" class="mono ink">Spleen 5x8 / JetBrains 12·14 PNG + FactSheet (CASI off)</text>
  <text x="564" y="181" font-size="9.5" class="mono muted">49.0% raw / 34.1% wtd · 79.7% KV (live-tail safe read)</text>

  <!-- P0 Box -->
  <rect x="552" y="202" width="202" height="92" rx="7" class="card"/>
  <text x="564" y="221" font-size="10.5" font-weight="700" class="mono link">P0 · Structural</text>
  <text x="564" y="238" font-size="9.5" class="mono ink">XML-Island TSCG (96/140c)</text>
  <text x="564" y="253" font-size="9.5" class="mono ink">Schema DAG ($defs._fN)</text>
  <text x="564" y="268" font-size="9.5" class="mono ink">JSON-in-JSON unwrap (8 keys)</text>
  <text x="564" y="283" font-size="9.5" class="mono muted">cleanUser off (&gt;=1500c opt)</text>

  <!-- P1 Box -->
  <rect x="766" y="202" width="202" height="92" rx="7" class="card"/>
  <text x="778" y="221" font-size="10.5" font-weight="700" class="mono warn">P1 · CASI v2</text>
  <text x="778" y="238" font-size="9.5" class="mono ink">Gutter strip + seedBase</text>
  <text x="778" y="253" font-size="9.5" class="mono ink">LIS shift line alignment</text>
  <text x="778" y="268" font-size="9.5" class="mono ink">FastCDC 8–48L slices</text>
  <text x="778" y="283" font-size="9.5" class="mono muted">Disabled when Optical on</text>

  <!-- P2 Box -->
  <rect x="552" y="304" width="416" height="72" rx="7" class="card-accent"/>
  <text x="564" y="324" font-size="10.5" font-weight="700" class="mono accent">P2 · LSM-Context Tiered Compaction (text-history.ts)</text>
  <text x="564" y="342" font-size="9.5" class="mono ink">L1 (tail=2, &gt;=1500 tok) -&gt; L0 (tail=6) · 1-block sticky keys</text>
  <text x="564" y="359" font-size="9.5" class="mono muted">L2 cold repack (5 usage fields) + justRepacked cooldown</text>

  <!-- P3 Box -->
  <rect x="552" y="386" width="416" height="124" rx="7" class="card-violet"/>
  <text x="564" y="405" font-size="10.5" font-weight="700" class="mono violet">P3 · Context-MMU Virtual Memory (context-mmu.ts)</text>
  <text x="564" y="423" font-size="9.5" class="mono ink">ContextPageStore: pg_&lt;12hex&gt; UTF-8 FNV-1a · 512p / 16 MiB LRU</text>
  <text x="564" y="439" font-size="9.5" class="mono ink">In-band Tail Hydration: +-15L slices in live tail only</text>
  <text x="564" y="455" font-size="9.5" class="mono ink">Markovian Fold (FAIL-&gt;PASS) + Birth IDF Density Prune</text>
  <text x="564" y="471" font-size="9.5" class="mono accent">Skill Linker: stub Turn 1, pin keptSkills, auto-hydrate</text>
  <text x="564" y="490" font-size="9.5" class="mono muted">stageToggles: lsm · mmu · skillLinker (0 prefix edits)</text>

  <!-- Column 4: Cache & Upstream -->
  <rect x="1002" y="90" width="244" height="436" rx="10" class="col"/>
  <text x="1016" y="113" font-size="10.5" font-weight="700" letter-spacing="0.9" class="mono accent">4 · CACHE &amp; UPSTREAM</text>

  <rect x="1016" y="128" width="216" height="122" rx="7" class="card"/>
  <text x="1028" y="149" font-size="12" font-weight="700" class="ink">Local State (0600)</text>
  <text x="1028" y="168" font-size="9.5" class="mono muted">~/.fiche/session-state.json</text>
  <text x="1028" y="185" font-size="9.5" class="mono accent">RAM MMU (opt-in mmu-pages)</text>
  <text x="1028" y="202" font-size="9.5" class="mono link">~/.config/fiche/</text>
  <text x="1028" y="218" font-size="9.5" class="mono link">  calibrated-models.json</text>
  <text x="1028" y="235" font-size="9.5" class="mono muted">~/.fiche/events.jsonl</text>

  <rect x="1016" y="262" width="216" height="88" rx="7" class="card-accent"/>
  <text x="1028" y="283" font-size="12" font-weight="700" class="accent">Prefix Cache Seal</text>
  <text x="1028" y="302" font-size="9.5" class="mono ink">87.4–89.7% KV cache hit</text>
  <text x="1028" y="319" font-size="9.5" class="mono muted">Immutable sealed epoch bytes</text>
  <text x="1028" y="335" font-size="9.5" class="mono muted">0.05x–0.10x read billing</text>

  <rect x="1016" y="362" width="216" height="148" rx="7" class="card"/>
  <text x="1028" y="383" font-size="12" font-weight="700" class="ink">29 Hosts (6 1P + 23 COMPAT)</text>
  <text x="1028" y="403" font-size="9.5" class="mono ink">api.anthropic.com</text>
  <text x="1028" y="420" font-size="9.5" class="mono ink">api.openai.com · codex</text>
  <text x="1028" y="437" font-size="9.5" class="mono ink">generativelanguage</text>
  <text x="1028" y="454" font-size="9.5" class="mono ink">cloudcode-pa /v1internal</text>
  <text x="1028" y="472" font-size="9.5" class="mono muted">DeepSeek · Kimi · GLM</text>
  <text x="1028" y="489" font-size="9.5" class="mono muted">xAI · OpenRouter · Groq</text>

  <!-- Connector arrows -->
  <line x1="264" y1="227" x2="282" y2="227" stroke-width="1.8" style="stroke: var(--link)" marker-end="url(#arr-link)"/>
  <line x1="518" y1="160" x2="536" y2="160" stroke-width="1.8" style="stroke: var(--warn)" marker-end="url(#arr-warn)"/>
  <line x1="518" y1="304" x2="536" y2="304" stroke-width="1.8" style="stroke: var(--accent)" marker-end="url(#arr-accent)"/>
  <line x1="982" y1="306" x2="1000" y2="306" stroke-width="1.8" style="stroke: var(--accent)" marker-end="url(#arr-accent)"/>
  <line x1="982" y1="436" x2="1000" y2="436" stroke-width="1.8" style="stroke: var(--violet)" marker-end="url(#arr-violet)"/>

  <!-- Bottom Local Stats & Control Strip -->
  <rect x="34" y="544" width="288" height="74" rx="8" class="card"/>
  <text x="48" y="567" font-size="11.5" font-weight="700" class="mono link">HTTP Headers &amp; Local Stats</text>
  <text x="48" y="586" font-size="9.5" class="mono muted">x-fiche-saved-tokens · stages</text>
  <text x="48" y="603" font-size="9.5" class="mono muted">cliff-saved-usd · events.jsonl</text>

  <rect x="342" y="544" width="288" height="74" rx="8" class="card"/>
  <text x="356" y="567" font-size="11.5" font-weight="700" class="mono warn">Dashboard &amp; MMU API :47821</text>
  <text x="356" y="586" font-size="9.5" class="mono muted">/api/mmu/stats · /api/mmu/page</text>
  <text x="356" y="603" font-size="9.5" class="mono muted">/api/calibration · PNG inspect</text>

  <rect x="650" y="544" width="288" height="74" rx="8" class="card"/>
  <text x="664" y="567" font-size="11.5" font-weight="700" class="mono accent">fiche turn-report (&lt;5 ms)</text>
  <text x="664" y="586" font-size="9.5" class="mono muted">CLI reverse tail scan · 0 tok</text>
  <text x="664" y="603" font-size="9.5" class="mono muted">Same-origin JSON · no-store</text>

  <rect x="958" y="544" width="288" height="74" rx="8" class="card"/>
  <text x="972" y="567" font-size="11.5" font-weight="700" class="mono violet">fiche-mcp (:47823 / stdio)</text>
  <text x="972" y="586" font-size="9.5" class="mono muted">page_in(pg_*) · mmu_stats</text>
  <text x="972" y="603" font-size="9.5" class="mono muted">check_model · transform · stats</text>
</svg>
