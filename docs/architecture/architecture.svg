<title id="inkling-architecture-title">inkling architecture</title>
<desc id="inkling-architecture-desc">A coding agent talks to the local inkling proxy, which routes the request, rewrites stale context into PNG pages for strong readers, and forwards it to the model API while logging every event for the dashboard.</desc>
