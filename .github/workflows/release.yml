name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Signed release tag to stage on npm & publish GitHub Release (example: v0.19.0)"
        required: true
        type: string

# Never let two runs for the same tag race through registry checks/staging.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release # must match the npm Trusted Publisher config (--allow-stage-publish)
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing (stage-only, no NPM_TOKEN)
    outputs:
      commit_sha: ${{ steps.verify.outputs.commit_sha }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag syntax
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "invalid release tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          # Publishing uses OIDC, and the release job receives its own token.
          # No later command needs a credential persisted in git config.
          persist-credentials: false
          # Required to prove the tagged commit belongs to the default branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm@12.0.2 requires Node 24.15.0 or newer. Keep this exact so a
          # runner tool-cache change cannot silently alter the release runtime.
          node-version: 24.15.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version and default branch
        id: verify
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "release tag $TAG does not match package version $EXPECTED_TAG" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]; then
            echo "release tag $TAG must be a signed annotated tag, not a lightweight tag" >&2
            exit 1
          fi
          TAGGED_COMMIT=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if [ "$(git rev-parse HEAD)" != "$TAGGED_COMMIT" ]; then
            echo "checked-out HEAD $(git rev-parse HEAD) does not match tag commit $TAGGED_COMMIT" >&2
            exit 1
          fi
          git fetch --no-tags --quiet origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$TAGGED_COMMIT" "origin/$DEFAULT_BRANCH"; then
            echo "tagged commit $TAGGED_COMMIT is not reachable from $DEFAULT_BRANCH" >&2
            exit 1
          fi
          echo "commit_sha=${TAGGED_COMMIT}" >> "$GITHUB_OUTPUT"

      # The publish job can mint an npm OIDC token. Do not execute transitive
      # dependency lifecycle scripts in that privileged job; the repository's
      # own prepublishOnly gate still runs during npm stage publish below.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Skip if this version is already published on npm (idempotent re-runs)
      - name: Check version not already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION already published - skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly runs typecheck + build + test as the gate.
      # Auth via npm Trusted Publisher (OIDC, stage-only) — no NPM_TOKEN exists.
      # Staged release requires manual maintainer approval (`npm stage approve <id>` with 2FA).
      - if: steps.check.outputs.skip == 'false'
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          npm install --global --ignore-scripts npm@12.0.2
          npm stage publish --access public --provenance
          echo "::notice::$NAME@$VERSION is staged on npm. Inspect & approve with 'npm stage list $NAME' then 'npm stage approve <id>'."

  release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub Release for the pushed tag
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job intentionally has no checkout. Tell gh which repository to
          # target instead of relying on a git remote that is not present.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --generate-notes

  build-macos:
    needs: [publish, release]
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
      artifact: ${{ steps.package.outputs.artifact }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.publish.outputs.commit_sha }}
          persist-credentials: false

      - name: Build unsigned FicheBar.app
        id: package
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          CFBundleShortVersionString="${VERSION}" ./apps/macos-bar/bundle.sh --unsigned --no-install
          APP_PATH="apps/macos-bar/build.noindex/FicheBar.app"
          test -x "${APP_PATH}/Contents/MacOS/FicheBar"
          mkdir -p "${RUNNER_TEMP}/unsigned"
          ZIP="${RUNNER_TEMP}/unsigned/FicheBar-unsigned.zip"
          /usr/bin/ditto --norsrc -c -k --keepParent "${APP_PATH}" "${ZIP}"
          echo "sha256=$(shasum -a 256 "${ZIP}" | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
          echo "artifact=FicheBar-unsigned-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload unsigned FicheBar artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ runner.temp }}/unsigned/FicheBar-unsigned.zip
          if-no-files-found: error
          retention-days: 1

  release-macos:
    needs: [publish, release, build-macos]
    environment: release # holds Developer ID & App Store Connect notarization secrets
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      UNSIGNED_SHA256: ${{ needs.build-macos.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.publish.outputs.commit_sha }}
          persist-credentials: false

      - name: Check signing & notarization secrets
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_DEVELOPER_ID_P12 APPLE_DEVELOPER_ID_PASSWORD \
            APP_STORE_CONNECT_API_KEY_P8 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required release secret ${name} is missing" >&2
              exit 1
            fi
          done

      - name: Download unsigned FicheBar artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-macos.outputs.artifact }}
          path: ${{ runner.temp }}/unsigned

      - name: Verify and unpack unsigned bundle
        run: |
          set -euo pipefail
          ZIP="${RUNNER_TEMP}/unsigned/FicheBar-unsigned.zip"
          ACTUAL="$(shasum -a 256 "${ZIP}" | cut -d' ' -f1)"
          [[ "${ACTUAL}" == "${UNSIGNED_SHA256}" ]] || {
            echo "::error::unsigned artifact sha256 mismatch" >&2
            exit 1
          }
          python3 -I - "${ZIP}" "FicheBar.app/" <<'PY'
          import pathlib, stat, sys, zipfile
          archive, prefix = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename
                  path = pathlib.PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts or not (name + "/").startswith(prefix):
                      raise SystemExit(f"unexpected entry in unsigned artifact: {name!r}")
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f"symlink entry rejected in unsigned artifact: {name!r}")
          PY
          WORK="${RUNNER_TEMP}/app"
          rm -rf "${WORK}" && mkdir -p "${WORK}"
          /usr/bin/ditto -x -k "${ZIP}" "${WORK}"
          test -x "${WORK}/FicheBar.app/Contents/MacOS/FicheBar"
          echo "APP_PATH=${WORK}/FicheBar.app" >> "${GITHUB_ENV}"

      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RUNNER_TEMP}/fiche-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$(mktemp "${RUNNER_TEMP}/fiche-cert.XXXXXX")"
          trap 'rm -f "${CERT_PATH}"' EXIT

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          printf '%s' "${APPLE_DEVELOPER_ID_P12}" | base64 --decode > "${CERT_PATH}"
          chmod 600 "${CERT_PATH}"
          security import "${CERT_PATH}" -P "${APPLE_DEVELOPER_ID_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain

      - name: Developer ID sign FicheBar.app
        run: ./apps/macos-bar/sign-app.sh "${APP_PATH}"

      - name: Notarize, staple, and Gatekeeper-verify FicheBar.app
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          API_KEY_PATH="$(mktemp "${RUNNER_TEMP}/fiche-api-key.XXXXXX")"
          trap 'rm -f "${API_KEY_PATH}"' EXIT
          API_KEY_CONTENT="${APP_STORE_CONNECT_API_KEY_P8//\\n/$'\n'}"
          printf '%s' "${API_KEY_CONTENT}" > "${API_KEY_PATH}"
          chmod 600 "${API_KEY_PATH}"
          unset API_KEY_CONTENT
          ./apps/macos-bar/notarize-app.sh "${APP_PATH}" \
            --key "${API_KEY_PATH}" \
            --key-id "${APP_STORE_CONNECT_KEY_ID}" \
            --issuer "${APP_STORE_CONNECT_ISSUER_ID}"

      - name: Package & upload signed notarized FicheBar zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          ZIP_NAME="FicheBar-${VERSION}.zip"
          /usr/bin/ditto --norsrc -c -k --keepParent "${APP_PATH}" "${ZIP_NAME}"
          shasum -a 256 "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
          gh release upload "${TAG}" "${ZIP_NAME}" "${ZIP_NAME}.sha256" --clobber

      - name: Clean up temporary signing keychain
        if: always()
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/fiche-signing.keychain-db"
          if [[ -f "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}" || rm -f "${KEYCHAIN_PATH}" || true
          fi
          security list-keychains -d user -s login.keychain || true
