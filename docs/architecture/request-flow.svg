<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 856" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fiche-request-flow-title fiche-request-flow-desc" id="request-flow-root">
<title id="fiche-request-flow-title">One request through fiche</title>
<desc id="fiche-request-flow-desc">Each request is checked against FICHE_MODELS and compression state: strong pixel readers get optical microfiche pages + verbatim FactSheets where cheaper than text, while text-tier models run through the 4-Layer Deterministic Text Compiler (TSCG → TOON → ACDC → CASI, 0 images), falling back to Passthrough only when FICHE_TEXT_HYGIENE=off or the payload is already clean.</desc>
<defs>
  <style>
    #request-flow-root { --paper:#f7f5f0;--paper-2:#ece9e1;--ink:#1b2733;--muted:#475a6b;--soft:#56687a;--accent:#0d7a6a;--link:#3b4fb8;--node:#ffffff;--ink-rgb:27,39,51;--muted-rgb:71,90,107;--soft-rgb:86,104,122;--accent-rgb:13,122,106;--link-rgb:59,79,184; }
    @media (prefers-color-scheme: dark) { #request-flow-root { --paper:#1b2733;--paper-2:#263646;--ink:#f7f5f0;--muted:#c3c8cc;--soft:#93a3b1;--accent:#4cc4ad;--link:#8b9cf0;--node:#263646;--ink-rgb:247,245,240;--muted-rgb:195,200,204;--soft-rgb:147,163,177;--accent-rgb:76,196,173;--link-rgb:139,156,240; } }
    #request-flow-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: var(--ink); }
  </style>
  <marker id="fiche-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--muted)"/></marker>
  <marker id="fiche-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--accent)"/></marker>
  <marker id="fiche-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--link)"/></marker>
  <marker id="fiche-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" style="fill:none;stroke:var(--muted);stroke-width:1.2"/></marker>
</defs>
<rect width="100%" height="100%" style="fill:var(--paper)"/>

<!-- Title Banner -->
<text x="32" y="34" font-size="16" font-weight="700" style="fill:var(--ink)">One request through fiche</text>
<text x="32" y="52" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" style="fill:var(--muted)">Hybrid optical microfiche + 4-layer deterministic text routing · cache-safe &amp; edit-protected</text>

<!-- Edges -->
<!-- Request in -> Diamond 1 -->
<path d="M 330,120 L 330,144" marker-end="url(#fiche-arrow)" style="fill:none;stroke:var(--muted);stroke-width:1.2"/>
<!-- Diamond 1 YES -> Diamond 2 -->
<path d="M 330,224 L 330,264" marker-end="url(#fiche-arrow)" style="fill:none;stroke:var(--muted);stroke-width:1.2"/>
<!-- Diamond 1 NO -> Pass through (routes clear at x=825) -->
<path d="M 434,184 L 817,184 Q 825,184 825,192 L 825,488" marker-end="url(#fiche-arrow)" style="fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4,3"/>
<!-- Diamond 2 YES -> Diamond 3 -->
<path d="M 330,344 L 330,384" marker-end="url(#fiche-arrow-accent)" style="fill:none;stroke:var(--accent);stroke-width:1.3"/>
<!-- Diamond 2 NO -> 4-Layer Deterministic Text Compiler -->
<path d="M 434,304 L 494,304" marker-end="url(#fiche-arrow-link)" style="fill:none;stroke:var(--link);stroke-width:1.4"/>
<!-- Diamond 3 YES -> Render pages -->
<path d="M 330,464 L 330,504" marker-end="url(#fiche-arrow-accent)" style="fill:none;stroke:var(--accent);stroke-width:1.4"/>
<!-- Diamond 3 NO -> Keep as text -->
<path d="M 226,424 L 124,424 Q 116,424 116,432 L 116,488" marker-end="url(#fiche-arrow)" style="fill:none;stroke:var(--muted);stroke-width:1.2"/>
<!-- Render pages -> Forward -->
<path d="M 330,568 L 330,608" marker-end="url(#fiche-arrow-accent)" style="fill:none;stroke:var(--accent);stroke-width:1.4"/>
<!-- Keep as text -> Forward -->
<path d="M 116,552 L 116,632 Q 116,640 124,640 L 250,640" marker-end="url(#fiche-arrow)" style="fill:none;stroke:var(--muted);stroke-width:1.2"/>
<!-- 4-Layer Text Compiler -> Forward (compressed text path) -->
<path d="M 580,350 L 580,624 Q 580,632 572,632 L 410,632" marker-end="url(#fiche-arrow-link)" style="fill:none;stroke:var(--link);stroke-width:1.4"/>
<!-- 4-Layer Text Compiler -> Pass through (only if FICHE_TEXT_HYGIENE=off or clean payload) -->
<path d="M 730,350 L 730,488" marker-end="url(#fiche-arrow-open)" style="fill:none;stroke:var(--muted);stroke-width:1.1;stroke-dasharray:4,3"/>
<!-- Pass through -> Forward -->
<path d="M 790,552 L 790,640 Q 790,648 782,648 L 410,648" marker-end="url(#fiche-arrow)" style="fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:4,3"/>
<!-- Forward -> Measure -->
<path d="M 330,672 L 330,712" marker-end="url(#fiche-arrow-link)" style="fill:none;stroke:var(--link);stroke-width:1.2"/>

<!-- Edge Labels -->
<rect x="338" y="238" width="28" height="12" rx="2" style="fill:var(--paper)"/><text x="343" y="247" font-size="8" font-family="ui-monospace, Menlo, monospace" letter-spacing="0.08em" style="fill:var(--muted)">YES</text>
<rect x="598" y="168" width="132" height="12" rx="2" style="fill:var(--paper)"/><text x="664" y="177" font-size="8" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.04em" style="fill:var(--muted)">NO (off / bypassed)</text>
<rect x="338" y="358" width="28" height="12" rx="2" style="fill:var(--paper)"/><text x="343" y="367" font-size="8" font-family="ui-monospace, Menlo, monospace" letter-spacing="0.08em" style="fill:var(--accent)">YES</text>
<rect x="448" y="284" width="28" height="12" rx="2" style="fill:var(--paper)"/><text x="462" y="293" font-size="8" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em" style="fill:var(--link)">NO</text>
<rect x="338" y="478" width="28" height="12" rx="2" style="fill:var(--paper)"/><text x="343" y="487" font-size="8" font-family="ui-monospace, Menlo, monospace" letter-spacing="0.08em" style="fill:var(--accent)">YES</text>
<rect x="158" y="404" width="24" height="12" rx="2" style="fill:var(--paper)"/><text x="170" y="413" font-size="8" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em" style="fill:var(--muted)">NO</text>
<rect x="652" y="410" width="150" height="24" rx="2" style="fill:var(--paper)"/>
<text x="727" y="421" font-size="7.5" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" style="fill:var(--muted)">HYGIENE=off</text>
<text x="727" y="431" font-size="7.5" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" style="fill:var(--muted)">or clean payload</text>
<rect x="338" y="686" width="44" height="12" rx="2" style="fill:var(--paper)"/><text x="343" y="695" font-size="8" font-family="ui-monospace, Menlo, monospace" letter-spacing="0.08em" style="fill:var(--link)">STREAM</text>

<!-- Nodes -->
<!-- Request in -->
<rect x="226" y="72" width="208" height="48" rx="20" style="fill:var(--node);stroke:var(--ink);stroke-width:1"/>
<text x="330" y="95" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Request in</text>
<text x="330" y="109" font-size="9" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" style="fill:var(--muted)">route + credential</text>

<!-- Diamond 1: Model in scope, compress on? -->
<polygon points="330,144 434,184 330,224 226,184" style="fill:var(--node);stroke:var(--ink);stroke-width:1"/>
<text x="330" y="182" font-size="11.5" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Model in scope,</text>
<text x="330" y="197" font-size="11.5" font-weight="600" text-anchor="middle" style="fill:var(--ink)">compress on?</text>

<!-- Diamond 2: Strong pixel reader? -->
<polygon points="330,264 434,304 330,344 226,304" style="fill:rgba(var(--accent-rgb),0.08);stroke:var(--accent);stroke-width:1.2"/>
<text x="330" y="302" font-size="11.5" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Strong pixel</text>
<text x="330" y="317" font-size="11.5" font-weight="600" text-anchor="middle" style="fill:var(--ink)">reader?</text>

<!-- Diamond 3: Image cheaper than its text? -->
<polygon points="330,384 434,424 330,464 226,424" style="fill:var(--node);stroke:var(--ink);stroke-width:1"/>
<text x="330" y="422" font-size="11.5" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Image cheaper</text>
<text x="330" y="437" font-size="11.5" font-weight="600" text-anchor="middle" style="fill:var(--ink)">than its text?</text>

<!-- 4-Layer Deterministic Text Compiler -->
<rect x="496" y="258" width="272" height="92" rx="6" style="fill:rgba(var(--link-rgb),0.08);stroke:var(--link);stroke-width:1.2"/>
<rect x="504" y="266" width="114" height="12" rx="2" style="fill:transparent;stroke:rgba(var(--link-rgb),0.55);stroke-width:0.8"/>
<text x="561" y="275" font-size="7" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em" style="fill:var(--link)">TEXT TIER · 0 IMAGES</text>
<text x="632" y="297" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--ink)">4-Layer Deterministic Text Compiler</text>
<text x="632" y="315" font-size="9" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" style="fill:var(--link)">TSCG → TOON → ACDC → CASI (0 images)</text>
<text x="632" y="331" font-size="8.5" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" style="fill:var(--muted)">isCodeOrDiffProtected() stays verbatim</text>

<!-- Render pages -->
<rect x="242" y="504" width="176" height="64" rx="6" style="fill:rgba(var(--accent-rgb),0.08);stroke:var(--accent);stroke-width:1"/>
<rect x="250" y="512" width="56" height="12" rx="2" style="fill:transparent;stroke:rgba(var(--accent-rgb),0.50);stroke-width:0.8"/>
<text x="278" y="521" font-size="7" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em" style="fill:var(--accent)">PER BLOCK</text>
<text x="330" y="540" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Render pages</text>
<text x="330" y="556" font-size="9" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" style="fill:var(--muted)">PNG + FactSheet</text>

<!-- Keep as text -->
<rect x="36" y="488" width="160" height="64" rx="6" style="fill:var(--node);stroke:var(--ink);stroke-width:1"/>
<rect x="44" y="496" width="56" height="12" rx="2" style="fill:transparent;stroke:rgba(var(--ink-rgb),0.40);stroke-width:0.8"/>
<text x="72" y="505" font-size="7" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em" style="fill:var(--ink)">PER BLOCK</text>
<text x="116" y="524" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Keep as text</text>
<text x="116" y="540" font-size="9" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" style="fill:var(--muted)">block unchanged</text>

<!-- Pass through -->
<rect x="690" y="488" width="200" height="64" rx="6" style="fill:rgba(var(--ink-rgb),0.02);stroke:rgba(var(--ink-rgb),0.20);stroke-width:1;stroke-dasharray:4,3"/>
<rect x="698" y="496" width="60" height="12" rx="2" style="fill:transparent;stroke:rgba(var(--ink-rgb),0.20);stroke-width:0.8"/>
<text x="728" y="505" font-size="7" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em" style="fill:var(--soft)">WHOLE BODY</text>
<text x="790" y="524" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Pass through</text>
<text x="790" y="540" font-size="9" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" style="fill:var(--muted)">bytes unchanged</text>

<!-- Forward -->
<rect x="250" y="608" width="160" height="64" rx="6" style="fill:var(--node);stroke:var(--ink);stroke-width:1"/>
<rect x="258" y="616" width="52" height="12" rx="2" style="fill:transparent;stroke:rgba(var(--ink-rgb),0.40);stroke-width:0.8"/>
<text x="284" y="625" font-size="7" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em" style="fill:var(--ink)">UPSTREAM</text>
<text x="330" y="644" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Forward</text>
<text x="330" y="660" font-size="9" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" style="fill:var(--muted)">provider API</text>

<!-- Measure -->
<rect x="226" y="712" width="208" height="48" rx="20" style="fill:var(--node);stroke:var(--ink);stroke-width:1"/>
<text x="330" y="735" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Measure</text>
<text x="330" y="749" font-size="9" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" style="fill:var(--muted)">usage · x-fiche-* · events.jsonl</text>

<!-- Legend -->
<line x1="32" y1="792" x2="888" y2="792" style="stroke:rgba(var(--ink-rgb),0.10);stroke-width:0.8"/>
<text x="32" y="810" font-size="8" font-family="ui-monospace, Menlo, monospace" letter-spacing="0.18em" style="fill:var(--muted)">LEGEND</text>
<rect x="32" y="824" width="14" height="10" rx="2" style="fill:rgba(var(--accent-rgb),0.08);stroke:var(--accent);stroke-width:1"/>
<text x="52" y="832" font-size="8.5" style="fill:var(--muted)">Optical Microfiche</text>
<rect x="164" y="824" width="14" height="10" rx="2" style="fill:rgba(var(--link-rgb),0.08);stroke:var(--link);stroke-width:1"/>
<text x="184" y="832" font-size="8.5" style="fill:var(--muted)">4-Layer Text Compiler</text>
<rect x="312" y="824" width="14" height="10" rx="2" style="fill:var(--node);stroke:var(--ink);stroke-width:1"/>
<text x="332" y="832" font-size="8.5" style="fill:var(--muted)">Step</text>
<rect x="380" y="824" width="14" height="10" rx="2" style="fill:rgba(var(--ink-rgb),0.02);stroke:rgba(var(--ink-rgb),0.20);stroke-width:1"/>
<text x="400" y="832" font-size="8.5" style="fill:var(--muted)">Untouched</text>
<line x1="472" y1="829" x2="498" y2="829" marker-end="url(#fiche-arrow-accent)" style="stroke:var(--accent);stroke-width:1.2"/>
<text x="506" y="832" font-size="8.5" style="fill:var(--muted)">Optical path</text>
<line x1="582" y1="829" x2="608" y2="829" marker-end="url(#fiche-arrow-link)" style="stroke:var(--link);stroke-width:1.2"/>
<text x="616" y="832" font-size="8.5" style="fill:var(--muted)">Text path / Upstream</text>
<line x1="726" y1="829" x2="752" y2="829" marker-end="url(#fiche-arrow-open)" style="stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4,3"/>
<text x="760" y="832" font-size="8.5" style="fill:var(--muted)">Passthrough</text>
</svg>
