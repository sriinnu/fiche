<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 940 872" width="940" height="872" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fiche-request-flow-title fiche-request-flow-desc" id="request-flow-root">
<title id="fiche-request-flow-title">One request through fiche (P0–P3 + Optical Pipeline)</title>
<desc id="fiche-request-flow-desc">Inbound requests pass bypass/scope and calibrated readerTier checks: calibrated vision readers use optical microfiche pages + FactSheets (with CASI off and pinnedUserText moved to the trailing live turn), while text-tier models run the P0–P3 deterministic compiler (Turn-1 Skill Linker, XML-Island TSCG + Merkle Schema DAG, JSON Unwrap + @toon + IDF Prune, Markovian Fold + LSM-Context L1/L0/L2 + RAM-first ContextPageStore, CASI v2 FastCDC, and In-Band Live-Tail Hydration) keeping L0 protected reads/diffs verbatim and sealed prefixes byte-identical.</desc>
<defs>
  <style>
    #request-flow-root { --paper:#f7f5f0;--paper-2:#ece9e1;--ink:#1b2733;--muted:#475a6b;--soft:#56687a;--accent:#0d7a6a;--link:#3b4fb8;--node:#ffffff;--ink-rgb:27,39,51;--muted-rgb:71,90,107;--soft-rgb:86,104,122;--accent-rgb:13,122,106;--link-rgb:59,79,184; }
    @media (prefers-color-scheme: dark) { #request-flow-root { --paper:#1b2733;--paper-2:#263646;--ink:#f7f5f0;--muted:#c3c8cc;--soft:#93a3b1;--accent:#4cc4ad;--link:#8b9cf0;--node:#263646;--ink-rgb:247,245,240;--muted-rgb:195,200,204;--soft-rgb:147,163,177;--accent-rgb:76,196,173;--link-rgb:139,156,240; } }
    #request-flow-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: var(--ink); }
  </style>
  <marker id="fiche-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--muted)"/></marker>
  <marker id="fiche-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--accent)"/></marker>
  <marker id="fiche-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--link)"/></marker>
  <marker id="fiche-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" style="fill:none;stroke:var(--muted);stroke-width:1.2"/></marker>
</defs>

<!-- Background Canvas -->
<rect width="940" height="872" rx="12" style="fill:var(--paper)"/>

<!-- Title Banner -->
<text x="32" y="34" font-size="16" font-weight="700" style="fill:var(--ink)">One request through fiche (P0–P3 + Optical Pipeline)</text>
<text x="32" y="52" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" style="fill:var(--muted)">Deterministic transform · Zero mutation of sealed prefix bytes · Protected L0 Read/Diff anchors</text>

<!-- Step 1: Inbound -->
<rect x="180" y="74" width="520" height="54" rx="8" style="fill:var(--node);stroke:var(--ink);stroke-width:1.2"/>
<text x="440" y="97" font-size="12" font-weight="700" text-anchor="middle" style="fill:var(--ink)">1 · Inbound API Request &amp; Bypass / Scope Guard</text>
<text x="440" y="114" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" style="fill:var(--muted)">Anthropic /v1/messages · OpenAI Responses/Chat · Google /v1internal:*</text>

<!-- Passthrough branch right -->
<line x1="700" y1="101" x2="774" y2="101" marker-end="url(#fiche-arrow-open)" style="stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4,3"/>
<rect x="778" y="74" width="128" height="54" rx="8" style="fill:rgba(var(--ink-rgb),0.03);stroke:rgba(var(--ink-rgb),0.22);stroke-width:1"/>
<text x="842" y="97" font-size="11" font-weight="600" text-anchor="middle" style="fill:var(--muted)">Bypass / Tiny</text>
<text x="842" y="113" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" style="fill:var(--muted)">Verbatim out</text>

<!-- Arrow down to Tier Router -->
<line x1="440" y1="128" x2="440" y2="160" marker-end="url(#fiche-arrow-link)" style="stroke:var(--link);stroke-width:1.4"/>

<!-- Step 2: Reader Tier + Calibrated Registry -->
<rect x="160" y="162" width="560" height="56" rx="8" style="fill:var(--node);stroke:var(--ink);stroke-width:1.2"/>
<text x="440" y="185" font-size="12" font-weight="700" text-anchor="middle" style="fill:var(--ink)">2 · readerTier(model) &amp; Calibrated Canary Registry</text>
<text x="440" y="203" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" style="fill:var(--muted)">Reads ~/.config/fiche/calibrated-models.json (HEX/CODE/NUM/GUARD) -&gt; Optical vs Text</text>

<!-- Split Optical Left vs Text Right -->
<line x1="300" y1="218" x2="204" y2="258" marker-end="url(#fiche-arrow-accent)" style="stroke:var(--accent);stroke-width:1.4"/>
<line x1="580" y1="218" x2="648" y2="258" marker-end="url(#fiche-arrow-link)" style="stroke:var(--link);stroke-width:1.4"/>

<!-- Optical Track (Left) -->
<rect x="38" y="260" width="332" height="278" rx="10" style="fill:rgba(var(--accent-rgb),0.06);stroke:var(--accent);stroke-width:1.2"/>
<text x="56" y="284" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace" style="fill:var(--accent)">OPTICAL MICROFICHE PATH</text>
<rect x="54" y="300" width="300" height="48" rx="6" style="fill:var(--node);stroke:var(--accent);stroke-width:1"/>
<text x="204" y="320" font-size="11" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Static Slab &amp; History PNG Render</text>
<text x="204" y="336" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" style="fill:var(--muted)">Spleen 5x8 (+Unifont) / JetBrains 12·14</text>

<rect x="54" y="362" width="300" height="48" rx="6" style="fill:var(--node);stroke:var(--accent);stroke-width:1"/>
<text x="204" y="382" font-size="11" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Deterministic ~96-tok FactSheet</text>
<text x="204" y="398" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" style="fill:var(--muted)">Sorted paths, SHAs, UUIDs, flags</text>

<rect x="54" y="424" width="300" height="98" rx="6" style="fill:var(--node);stroke:var(--accent);stroke-width:1;stroke-dasharray:3,2"/>
<text x="204" y="444" font-size="10.5" font-weight="700" text-anchor="middle" style="fill:var(--accent)">Optical Cache &amp; Safety Guards</text>
<text x="204" y="462" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" style="fill:var(--muted)">CASI disabled when Optical active</text>
<text x="204" y="478" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" style="fill:var(--muted)">pinnedUserText moved to live tail</text>
<text x="204" y="494" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" style="fill:var(--muted)">30-turn Google Optical: 79.7% KV hit</text>
<text x="204" y="510" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" style="fill:var(--accent)">49.0% raw · 34.1% wtd · editSafe OK</text>

<!-- P0-P3 Text + Context-MMU Track (Right) -->
<rect x="392" y="260" width="512" height="404" rx="10" style="fill:rgba(var(--link-rgb),0.06);stroke:var(--link);stroke-width:1.2"/>
<text x="410" y="284" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace" style="fill:var(--link)">P0–P3 TEXT + CONTEXT-MMU COMPILER (0 IMAGES)</text>

<rect x="410" y="300" width="476" height="44" rx="6" style="fill:var(--node);stroke:var(--link);stroke-width:1"/>
<text x="424" y="319" font-size="11" font-weight="700" style="fill:var(--ink)">P3-C Turn-1 Skill Linker (@fiche pin)</text>
<text x="424" y="334" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" style="fill:var(--muted)">Scores Turn 1 (&gt;=10 skills), stubs rest Turn 1, pins keptSkills</text>

<rect x="410" y="354" width="476" height="46" rx="6" style="fill:var(--node);stroke:var(--link);stroke-width:1"/>
<text x="424" y="373" font-size="11" font-weight="700" style="fill:var(--ink)">P0 Structural: XML-Island TSCG + Merkle Schema DAG ($defs._fN)</text>
<text x="424" y="389" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" style="fill:var(--muted)">Volatile islands (6 tags) verbatim · DAG on Anthropic/OAI only</text>

<rect x="410" y="410" width="476" height="48" rx="6" style="fill:var(--node);stroke:var(--link);stroke-width:1"/>
<text x="424" y="429" font-size="11" font-weight="700" style="fill:var(--ink)">P0 JSON Unwrap (8 keys) · Terminal · @toon · P3-D IDF Prune</text>
<text x="424" y="445" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" style="fill:var(--muted)">Opt-in cleanUserPayloads (off) · FILE_READ_TOOL_RE skipped</text>

<rect x="410" y="468" width="476" height="60" rx="6" style="fill:var(--node);stroke:var(--link);stroke-width:1"/>
<text x="424" y="487" font-size="11" font-weight="700" style="fill:var(--ink)">P3-B Markovian Fold + P2 LSM-Context -&gt; ContextPageStore</text>
<text x="424" y="503" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" style="fill:var(--muted)">FAIL-&gt;PASS episodes folded · L1 (tail=2, &gt;=1500) · L0 (6) · L2 cold</text>
<text x="424" y="518" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" style="fill:var(--muted)">RAM-only pg_&lt;12hex&gt; FNV-1a LRU (opt-in FICHE_MMU_PERSIST=1, 0600)</text>

<rect x="410" y="538" width="476" height="50" rx="6" style="fill:var(--node);stroke:var(--link);stroke-width:1"/>
<text x="424" y="557" font-size="11" font-weight="700" style="fill:var(--ink)">P1 CASI v2: Gutter Strip + seedBase + Shift LIS + FastCDC</text>
<text x="424" y="573" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" style="fill:var(--muted)">Seeds Write/Edit args · GEAR_TABLE 8-48L · skipped if Optical on</text>

<rect x="410" y="598" width="476" height="50" rx="6" style="fill:var(--node);stroke:var(--link);stroke-width:1"/>
<text x="424" y="617" font-size="11" font-weight="700" style="fill:var(--ink)">P3-A In-Band Live-Tail Hydration (computeTailHydration)</text>
<text x="424" y="633" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" style="fill:var(--muted)">+-15L slices in live tail only · MCP page_in runs out-of-band</text>

<!-- Converge into EditSafe + Prefix Seal -->
<line x1="204" y1="538" x2="204" y2="700" style="stroke:var(--accent);stroke-width:1.4"/>
<line x1="204" y1="700" x2="310" y2="700" marker-end="url(#fiche-arrow-accent)" style="stroke:var(--accent);stroke-width:1.4"/>
<line x1="648" y1="664" x2="648" y2="700" style="stroke:var(--link);stroke-width:1.4"/>
<line x1="648" y1="700" x2="570" y2="700" marker-end="url(#fiche-arrow-link)" style="stroke:var(--link);stroke-width:1.4"/>

<rect x="312" y="676" width="256" height="48" rx="8" style="fill:var(--node);stroke:var(--ink);stroke-width:1.4"/>
<text x="440" y="697" font-size="11.5" font-weight="700" text-anchor="middle" style="fill:var(--ink)">L0 EditSafe &amp; Prefix Seal</text>
<text x="440" y="713" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" style="fill:var(--muted)">Sealed chunks byte-identical across turns</text>

<!-- Measure / Output -->
<line x1="440" y1="724" x2="440" y2="738" marker-end="url(#fiche-arrow-link)" style="stroke:var(--link);stroke-width:1.4"/>
<rect x="184" y="740" width="512" height="48" rx="8" style="fill:var(--node);stroke:var(--ink);stroke-width:1.2"/>
<text x="440" y="761" font-size="12" font-weight="700" text-anchor="middle" style="fill:var(--ink)">Upstream Response + Cached-Token Feedback &amp; Measure</text>
<text x="440" y="777" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" style="fill:var(--muted)">noteCacheOutcome(5 usage fields) · x-fiche-* · events.jsonl</text>

<!-- Legend -->
<line x1="32" y1="808" x2="908" y2="808" style="stroke:rgba(var(--ink-rgb),0.12);stroke-width:0.8"/>
<text x="32" y="826" font-size="8" font-family="ui-monospace, Menlo, Consolas, monospace" letter-spacing="0.18em" style="fill:var(--muted)">LEGEND</text>
<rect x="32" y="840" width="14" height="10" rx="2" style="fill:rgba(var(--accent-rgb),0.08);stroke:var(--accent);stroke-width:1"/>
<text x="52" y="848" font-size="8.5" style="fill:var(--muted)">Optical Microfiche</text>
<rect x="166" y="840" width="14" height="10" rx="2" style="fill:rgba(var(--link-rgb),0.08);stroke:var(--link);stroke-width:1"/>
<text x="186" y="848" font-size="8.5" style="fill:var(--muted)">P0–P3 Text + MMU</text>
<rect x="312" y="840" width="14" height="10" rx="2" style="fill:var(--node);stroke:var(--ink);stroke-width:1"/>
<text x="332" y="848" font-size="8.5" style="fill:var(--muted)">Invariant / Step</text>
<rect x="430" y="840" width="14" height="10" rx="2" style="fill:rgba(var(--ink-rgb),0.03);stroke:rgba(var(--ink-rgb),0.22);stroke-width:1"/>
<text x="450" y="848" font-size="8.5" style="fill:var(--muted)">Untouched</text>
<line x1="522" y1="845" x2="548" y2="845" marker-end="url(#fiche-arrow-accent)" style="stroke:var(--accent);stroke-width:1.2"/>
<text x="556" y="848" font-size="8.5" style="fill:var(--muted)">Optical path</text>
<line x1="636" y1="845" x2="662" y2="845" marker-end="url(#fiche-arrow-link)" style="stroke:var(--link);stroke-width:1.2"/>
<text x="670" y="848" font-size="8.5" style="fill:var(--muted)">Text / MMU path</text>
<line x1="776" y1="845" x2="802" y2="845" marker-end="url(#fiche-arrow-open)" style="stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4,3"/>
<text x="810" y="848" font-size="8.5" style="fill:var(--muted)">Passthrough</text>
</svg>
