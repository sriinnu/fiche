name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Signed release tag to stage on npm & publish GitHub Release (example: v0.19.0)"
        required: true
        type: string

# Never let two runs for the same tag race through registry checks/staging.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release # must match the npm Trusted Publisher config (--allow-stage-publish)
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing (stage-only, no NPM_TOKEN)
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag syntax
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "invalid release tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          # Publishing uses OIDC, and the release job receives its own token.
          # No later command needs a credential persisted in git config.
          persist-credentials: false
          # Required to prove the tagged commit belongs to the default branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm@12.0.2 requires Node 24.15.0 or newer. Keep this exact so a
          # runner tool-cache change cannot silently alter the release runtime.
          node-version: 24.15.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version and default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "release tag $TAG does not match package version $EXPECTED_TAG" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]; then
            echo "release tag $TAG must be a signed annotated tag, not a lightweight tag" >&2
            exit 1
          fi
          TAGGED_COMMIT=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if [ "$(git rev-parse HEAD)" != "$TAGGED_COMMIT" ]; then
            echo "checked-out HEAD $(git rev-parse HEAD) does not match tag commit $TAGGED_COMMIT" >&2
            exit 1
          fi
          git fetch --no-tags --quiet origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$TAGGED_COMMIT" "origin/$DEFAULT_BRANCH"; then
            echo "tagged commit $TAGGED_COMMIT is not reachable from $DEFAULT_BRANCH" >&2
            exit 1
          fi

      # The publish job can mint an npm OIDC token. Do not execute transitive
      # dependency lifecycle scripts in that privileged job; the repository's
      # own prepublishOnly gate still runs during npm stage publish below.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Skip if this version is already published on npm (idempotent re-runs)
      - name: Check version not already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION already published - skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly runs typecheck + build + test as the gate.
      # Auth via npm Trusted Publisher (OIDC, stage-only) — no NPM_TOKEN exists.
      # Staged release requires manual maintainer approval (`npm stage approve <id>` with 2FA).
      - if: steps.check.outputs.skip == 'false'
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          npm install --global --ignore-scripts npm@12.0.2
          npm stage publish --access public --provenance
          echo "::notice::$NAME@$VERSION is staged on npm. Inspect & approve with 'npm stage list $NAME' then 'npm stage approve <id>'."

  release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub Release for the pushed tag
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job intentionally has no checkout. Tell gh which repository to
          # target instead of relying on a git remote that is not present.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --generate-notes

  release-macos:
    needs: release
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Build, sign, and zip FicheBar.app
        run: |
          VERSION="${TAG#v}"
          CFBundleShortVersionString="${VERSION}" ./apps/macos-bar/bundle.sh --no-install
          APP_PATH="apps/macos-bar/build.noindex/FicheBar.app"
          test -x "${APP_PATH}/Contents/MacOS/FicheBar"
          codesign --verify --deep --strict "${APP_PATH}"
          ZIP_NAME="FicheBar-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${ZIP_NAME}"
          shasum -a 256 "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload FicheBar zip to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" "$ZIP_NAME" "${ZIP_NAME}.sha256" --clobber
